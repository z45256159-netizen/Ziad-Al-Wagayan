# App theme — warm, editorial, readability-first (light).
[theme]
base = "light"
primaryColor = "#a23b2d"              # warm terracotta accent (buttons, links)
backgroundColor = "#fbfaf6"           # soft paper cream
secondaryBackgroundColor = "#f3efe7"  # cards / inputs / expanders
textColor = "#22201d"
font = "serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
